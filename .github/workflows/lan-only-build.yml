name: LAN-only build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Verify patch is present
        run: |
          echo "=== repo root ==="
          pwd
          ls -la
          echo "=== patch size ==="
          wc -c lan-only.patch
          head -n 5 lan-only.patch

      - name: 3. Clone upstream v0.3.3
        run: |
          git clone --depth 1 --branch v0.3.3 https://github.com/oinkvm/oink.git oink
          cd oink
          git rev-parse HEAD
          git log -1 --oneline

      - name: 4. Apply patch
        run: |
          cp lan-only.patch oink/lan-only.patch
          cd oink
          git apply --verbose --whitespace=nowarn lan-only.patch
          rm -f lan-only.patch
          git status --short
          ls -la crates/oink-network/src/lan.rs

      - name: 5. Commit patched tree
        run: |
          cd oink
          git add -A
          git -c user.email="actions@github.com" -c user.name="GitHub Actions" \
            commit -m "LAN-only: restrict peers to private networks and disable internet features"
          git log -1 --stat | head -n 40

      - name: 6. Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'

      - name: 7. Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: oink
          key: windows-x64-lan-only

      - name: 8. Install Python 3.14.6
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: 9. Install Node 24.14.1
        uses: actions/setup-node@v5
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: oink/package-lock.json

      - name: 10. Pin npm 11.11.0
        run: |
          npm install --global npm@11.11.0
          echo "rustc: $(rustc --version)"
          echo "node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "python: $(python --version)"

      - name: 11. npm ci
        working-directory: oink
        run: npm ci

      - name: 12. Build LAN-only MSI
        working-directory: oink
        run: python build-support/package.py --platform windows --build 1 --output-root ../build-out

      - name: 13. Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: oink-lan-only-msi
          path: build-out/**/*.msi
          if-no-files-found: error
